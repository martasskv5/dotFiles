source= ./target-monitor.conf

# ============================================================================
# Music Player Widget
# ============================================================================

# ----------------------------------------------------------------------------
# Album Art
# ----------------------------------------------------------------------------
image {
    monitor = $TARGET_MONITOR
    path = $HOME/.config/niri/scripts/music.webp
    size = 100
    rounding = 5
    border_size = 3
    border_color = rgba(216, 222, 233, 0.70)
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/niri/scripts/HyprlockMusic.sh --art
    position = 730, 57
    halign = left
    valign = bottom
    zindex = 1
}

# ----------------------------------------------------------------------------
# Player Background Box
# ----------------------------------------------------------------------------
shape {
    monitor = $TARGET_MONITOR
    color = rgba(100, 114, 125, 0.4)
    size = 500, 140
    rounding = 10
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 0
}

# ----------------------------------------------------------------------------
# Track Information
# ----------------------------------------------------------------------------

# Song title
label {
    monitor = $TARGET_MONITOR
    text = cmd[update:1000] echo "$(~/.config/niri/scripts/HyprlockMusic.sh --title)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 16
    font_family = SF Pro Display Heavy
    position = 55, 138
    halign = center
    valign = bottom
    zindex = 1
}

# Player source (e.g., Spotify, Firefox)
label {
    monitor = $TARGET_MONITOR
    text = cmd[update:1000] echo "$(~/.config/niri/scripts/HyprlockMusic.sh --player)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 13
    font_family = SF Pro Display Bold
    position = 205, 45
    halign = center
    valign = bottom
    zindex = 1
}

# Artist name
label {
    monitor = $TARGET_MONITOR
    text = cmd[update:1000] echo "󰠃  $(~/.config/niri/scripts/HyprlockMusic.sh --artist)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 12
    font_family = SF Pro Display Semibold
    position = 55, 118
    halign = center
    valign = bottom
    zindex = 1
}

# ----------------------------------------------------------------------------
# Playback Controls
# ----------------------------------------------------------------------------

# Previous track button
label {
    monitor = $TARGET_MONITOR
    text = 󰒮
    color = rgba(255, 255, 255, 0.75)
    font_size = 25
    onclick = playerctl previous
    position = -5, 55
    halign = center
    valign = bottom
}

# Play/Pause button
label {
    monitor = $TARGET_MONITOR
    text = cmd[update:1000] echo "$(~/.config/niri/scripts/HyprlockMusic.sh --status)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 25
    onclick = playerctl play-pause
    position = 55, 55
    halign = center
    valign = bottom
}

# Next track button
label {
    monitor = $TARGET_MONITOR
    text = 󰒭
    color = rgba(255, 255, 255, 0.75)
    font_size = 25
    onclick = playerctl next
    position = 110, 55
    halign = center
    valign = bottom
}

# ----------------------------------------------------------------------------
# Progress Display
# ----------------------------------------------------------------------------

# Current position timestamp
label {
    monitor = $TARGET_MONITOR
    text = cmd[update:1000] echo "$(~/.config/niri/scripts/HyprlockMusic.sh --position)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 10
    font_family = SF Pro Display Medium
    position = -100, 95
    halign = center
    valign = bottom
}

# Total length timestamp
label {
    monitor = $TARGET_MONITOR
    text = cmd[update:1000] echo "$(~/.config/niri/scripts/HyprlockMusic.sh --length)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 10
    font_family = SF Pro Display Medium
    position = 210, 95
    halign = center
    valign = bottom
}

# Progress bar (with Pango markup for colored segments)
label {
    monitor = $TARGET_MONITOR
    text = cmd[update:1000] echo "$(~/.config/niri/scripts/HyprlockMusic.sh --progress-bar)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 12
    font_family = SF Pro Display Medium
    position = 55, 95
    halign = center
    valign = bottom
}
