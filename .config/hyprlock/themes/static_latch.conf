background {
    monitor =
    path = /home/martinko/Pictures/wallpapers/BW-Doors.jpg
    blur_passes = 1
    blur_size = 0
    contrast = 0.8
    brightness = 0.7
    zindex = -2
}

# White rectangle behind clock
shape {
    monitor =
    size = 700, 220
    color = rgba(222, 222, 222, 0.77)
    rounding = 20
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    border_color = rgb(0, 0, 0)
    border_size = 2
}

label {
    monitor =
    text = cmd[update:60000] $HOME/.config/hyprlock/scripts/figlet-clock.sh
    color = rgb(0, 0, 0)
    font_size = 14
    font_family = Iosevka Term, monospace
    trim_cmd_output = false
    
    position = 0, 0
    halign = center
    valign = center
    text_align = center
}

input-field {
    # monitor = $TARGET_MONITOR
    size = 280, 60
    outline_thickness = 0 # Clean edge, borderless styling
    dots_size = 0.25 
    dots_spacing = 0.35 
    dots_center = true
    
    # Material You translucent UI Colors
    font_color = rgba(47, 47, 46, 0.65)  # Darker, muted organic green-tint
    inner_color = rgb(245, 242, 230)
    
    # Matching the extreme rounded corners of Pixel UI
    rounding = 30 
    
    fade_on_empty = true
    # placeholder_text = <span foreground="##e7e1c2">Unlock</span>
    hide_input = false
    
    position = 0, -300
    halign = center
    valign = center

    outline_thickness = 0
    inner_color = rgb(245, 242, 230)
    
    # --- FIX THE AUTHENTICATION FLASH ---
    # Forces the checking state to match your normal background color (hiding it)
    check_color = rgb(245, 242, 230) 
    
    # Controls the visual fade timing (in milliseconds) directly into red
    fail_transition = 0              # Set to 0 for an instant switch to red
    
    fail_color = rgba(255, 0, 0, 0.65)
    fail_text = <span foreground="##e7e1c2">Invalid password</span>
}