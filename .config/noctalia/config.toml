[audio]
enable_overdrive = true

[bar]
order = [ "Main" ]

    [bar.Main]
    background_opacity = 0.24999999441206455
    center = [ "workspaces", "notifications", "brightness", "privacy", "widget_2" ]
    end = [
        "tray",
        "ssh-agent-widget",
        "status",
        "clipboard",
        "widget",
        "bar",
        "keyboard_layout",
        "volume",
        "bluetooth",
        "toggle",
        "network",
        "battery",
        "control-center",
        "session"
    ]
    margin_ends = 0
    radius_bottom_left = 16
    radius_bottom_right = 16
    radius_top_left = 0
    radius_top_right = 0
    start = [ "group:g1", "spacer_2", "group:g2", "spacer_3", "active_window", "media", "audio_visualizer" ]

        [[bar.Main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "date", "clock" ]
        opacity = 0.0
        padding = 6.0

        [[bar.Main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "cpu", "temp", "ram" ]
        opacity = 0.0
        padding = 6.0

